# ~/.config/hypr/hyprlock.conf
# Lock screen for the Hyprland session. Triggered by hypridle's lock_cmd
# (30 min idle timeout + logind Lock signal from Super+L / before_sleep_cmd).
#
# Colours are base16 "Tomorrow Night" hard-coded — the tinty fanout
# (~/.config/tinted-theming/tinty/fanout.sh) does NOT theme this file yet.
# If the palette ever changes, update the rgb()/rgba() values below by hand
# or add a `# tinty:start/end` block + a hyprlock_block() to fanout.sh.

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

background {
    monitor =
    color = rgba(1d1f21ff)
}

# clock
label {
    monitor =
    text = cmd[update:30000] date +"%H:%M"
    color = rgba(c5c8c6ff)
    font_size = 90
    font_family = sans-serif
    position = 0, 80
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(969896ff)
    font_size = 18
    font_family = sans-serif
    position = 0, -10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    rounding = 6

    outer_color = rgba(373b41ff)
    inner_color = rgba(282a2eff)
    font_color  = rgba(c5c8c6ff)

    check_color = rgba(81a2beff)
    fail_color  = rgba(cc6666ff)
    fail_text   = <i>$FAIL ($ATTEMPTS)</i>

    placeholder_text = <i>locked</i>
    position = 0, -120
    halign = center
    valign = center
}
