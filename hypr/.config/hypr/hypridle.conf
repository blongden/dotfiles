# ~/.config/hypr/hypridle.conf
# Idle handling for the Hyprland session — ports ~/.config/sway/idle.sh
# (swayidle). Started from hyprland.lua autostart (`hl.exec_cmd("hypridle")`).
#
#   5 min idle  -> terminal screensaver (~/.config/screensaver/, compositor-agnostic)
#  30 min idle  -> lock (hyprlock) + displays off (DPMS)
#
# lock_cmd runs on the 30 min timeout AND on logind's Lock signal, so
# `loginctl lock-session` (Super+L, before_sleep_cmd) routes through the same
# hyprlock. `pidof` guard = never stack two instances.
#
# The 5 min screensaver listener has no on-resume — the screensaver process
# exits itself on a keypress (see its listener block below). The 30 min listener's
# on-resume restores DPMS; safety net: hyprland.lua sets key_press_enables_dpms
# / mouse_move_enables_dpms so any input force-wakes the panel regardless.
#
# NB the Lua config makes `hyprctl dispatch` parse its args AS LUA, so DPMS is
# `hl.dsp.dpms("off")`, not the old `dpms off`.

general {
    lock_cmd        = pidof hyprlock || hyprlock
    unlock_cmd      =
    before_sleep_cmd = loginctl lock-session                 # lock before suspend (no-op today — lid close hibernates; matters only if plain suspend is ever wired)
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'   # force displays back on after resume
    ignore_dbus_inhibit = false                              # let mpv/browsers inhibit idle during playback
}

listener {
    # Screensaver. No on-resume on purpose: mapping the fullscreen screensaver
    # window makes Hyprland re-evaluate the pointer, which the idle protocol
    # reports as activity ~1s after on-timeout, every cycle — hypridle can't
    # tell that phantom resume from a real one. So the screensaver script
    # closes itself on a keypress instead (keyboard only, by choice).
    # See memory/idle-screensaver.md.
    timeout    = 300
    on-timeout = ~/.config/screensaver/screensaver.sh start
}

listener {
    timeout    = 1800
    on-timeout = loginctl lock-session && hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms("on")'
}
