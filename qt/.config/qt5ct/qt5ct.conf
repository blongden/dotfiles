# qt5ct writes this file itself (QSettings). Keep the keys it expects.
# The palette lives in colors/tomorrow-night.conf (a tinty target).
# A [SettingsWindow] geometry block may reappear if you open the qt5ct GUI —
# it's per-machine UI state, safe to strip before committing.
[Appearance]
color_scheme_path=/home/ben/.config/qt5ct/colors/tomorrow-night.conf
custom_palette=true
icon_theme=breeze-dark
standard_dialogs=default
style=Fusion

[Interface]
activate_item_on_single_click=1
buttonbox_layout=0
cursor_flash_time=1000
dialog_buttons_have_icons=1
double_click_interval=400
gui_effects=@Invalid()
keyboard_scheme=2
menus_have_icons=true
show_shortcuts_in_context_menus=true
stylesheets=@Invalid()
underline_shortcut=1
wheel_scroll_lines=3
