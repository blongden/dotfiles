# Non-KDE Qt apps (VLC 3.x = Qt5) have no KColorScheme, so they ignore
# kdeglobals. Point them at the GTK3 platform theme so they inherit the
# already-themed GTK palette (~/.config/gtk-3.0/gtk.css, a tinty target).
# Needs qt5-gtk-platformtheme / qt6-gtk-platformtheme (both installed).
# KColorScheme apps (Dolphin, Kate…) still read kdeglobals on top of this.
QT_QPA_PLATFORMTHEME=gtk3
