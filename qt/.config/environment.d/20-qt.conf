# Plain-Qt apps (VLC 3.x = Qt5) have no KColorScheme and the gtk3 platform
# theme (qgtk3) has a Qt 5.15 bug where it ignores gtk-application-prefer-dark
# and always builds a light Adwaita palette. So use qt5ct instead: it applies an
# explicit palette from ~/.config/qt5ct/colors/tomorrow-night.conf (a tinty
# target). Needs the qt5ct package. KColorScheme apps (Dolphin, Kate…) still
# read kdeglobals on top of this.
QT_QPA_PLATFORMTHEME=qt5ct
