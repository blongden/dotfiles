# Session-wide PATH. The greeter (greetd/ReGreet) execs the compositor directly,
# so no shell rc runs — without this, ~/.local/bin and ~/bin are missing from
# anything the compositor launches (waybar scripts, keybind helpers, herdr).
# systemd --user reads environment.d and exports it into the session + D-Bus
# activation environment.
PATH=$HOME/.local/bin:$HOME/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin
