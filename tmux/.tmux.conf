bind-key C-b last-window

set -g default-terminal "screen-256color"

# enable mouse mode and allow scrolling
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf


##############  Design  ##############
# Colours come from tinty — see ~/.config/tinted-theming/tinty/. Everything
# below is structure only; `source` at the end applies the palette.

set -g status-justify left
set -g status-interval 2
set -g status-position bottom
set -g status-left ''
set -g status-left-length 20
set -g status-right ' %d/%m  %H:%M:%S '
set -g status-right-length 50

setw -g window-status-format ' #I:#W#F '
setw -g window-status-current-format ' #I:#W#F '

# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none


# Use vim keybindings in copy mode
setw -g mode-keys vi

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "/usr/local/bin/reattach-to-user-namespace /usr/bin/pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "/usr/local/bin/reattach-to-user-namespace /usr/bin/pbcopy"

set -g allow-rename off


# tinty palette (kept last so it wins); rewritten by `tinty apply`
source-file ~/.config/tmux/tinty.conf